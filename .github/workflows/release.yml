# Builds the standalone SwarmForge executable and its versioned archive.
#
# The toolchain is pinned: packaging needs the Bun 1.4.x compile API, and a
# different Bun can silently produce a different binary from the same source.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The default is read-only. The build job only needs the source; signing and
# draft creation receive their separate, narrowly scoped permissions below.
permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  ARTIFACT_NAME: swarmforge-linux-x64-glibc

jobs:
  build:
    name: Build and verify the executable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Verify the pinned toolchain
        run: |
          bun --version
          test "$(bun --version)" = "1.4.2"

      - name: Require the tag to match the packaged version
        # Checked before the expensive work, and again before anything is
        # published, so a mistyped tag fails in seconds instead of after a
        # build. The tag arrives as an environment variable and is only ever
        # used as a quoted argument, never interpolated into a shell command.
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/package.ts tag "$RELEASE_TAG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Static checks
        run: bun run check

      - name: Build the executable
        run: bun run build

      - name: Package the versioned archive
        run: bun run package

      - name: Write the external archive checksum
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          (cd dist && sha256sum "swarmforge-v${version}-linux-x64-glibc.tar.gz" > "swarmforge-v${version}-linux-x64-glibc.tar.gz.sha256")

      - name: Verify the packaged runtime
        # A packaged artifact that cannot answer for itself is not a release:
        # the executable must run with no Bun and no node_modules on PATH, and
        # it must report the version and commit it was built from. It is
        # installed into a temporary directory and invoked by absolute path, so
        # nothing is installed system-wide and no PATH can find the wrong file.
        run: |
          bun run package:verify
          version="$(bun -e 'console.log(require("./package.json").version)')"
          install_dir="$RUNNER_TEMP/swarmforge-install"
          install_home="$RUNNER_TEMP/swarmforge-home"
          mkdir -p "$install_dir" "$install_home"
          install -m 755 dist/swarmforge "$install_dir/swarmforge"
          test "$(env -i PATH=/usr/bin:/bin HOME="$install_home" "$install_dir/swarmforge" --version)" = "$version"
          env -i PATH=/usr/bin:/bin HOME="$install_home" "$install_dir/swarmforge" --help | grep "build $(git rev-parse HEAD)"
          env -i PATH=/usr/bin:/bin HOME="$install_home" "$install_dir/swarmforge" config path
          env -i PATH=/usr/bin:/bin HOME="$install_home" "$install_dir/swarmforge" config show > /dev/null

      - name: Extract the archive and check the installed mode
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          extract_dir="$RUNNER_TEMP/swarmforge-extract"
          install_home="$RUNNER_TEMP/swarmforge-home"
          mkdir -p "$extract_dir" "$install_home"
          tar -xzf "dist/swarmforge-v${version}-linux-x64-glibc.tar.gz" -C "$extract_dir"
          test -x "$extract_dir/swarmforge"
          (cd "$extract_dir" && sha256sum -c SHA256SUMS)
          install -m 755 "$extract_dir/swarmforge" "$RUNNER_TEMP/swarmforge-install/swarmforge-extracted"
          test "$(env -i PATH=/usr/bin:/bin HOME="$install_home" "$RUNNER_TEMP/swarmforge-install/swarmforge-extracted" --version)" = "$version"

      - name: Include the application license
        run: cp LICENSE dist/LICENSE

      - name: Upload build artifacts
        # The same assets on every trigger: the draft release is created from
        # exactly these files, never from a second build.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/swarmforge
            dist/SHA256SUMS
            dist/metadata-*.json
            dist/LICENSE
            dist/swarmforge-v*-linux-x64-glibc.tar.gz
            dist/swarmforge-v*-linux-x64-glibc.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Attest the verified release assets
    needs: build
    if: github.event_name == 'push' && github.repository == 'GavinGeizer/swarmforge-oss' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-assets

      - name: Verify paths, checksums, tag, and source metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REPOSITORY" = "GavinGeizer/swarmforge-oss"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          archive="swarmforge-v${version}-linux-x64-glibc.tar.gz"
          archive_sha="${archive}.sha256"
          metadata="metadata-${version}.json"
          expected="LICENSE SHA256SUMS ${archive} ${archive_sha} ${metadata} swarmforge"
          actual="$(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')"
          wanted="$(printf '%s\n' $expected | LC_ALL=C sort | tr '\n' ' ')"
          test "$actual" = "$wanted"
          (cd release-assets && sha256sum -c "$archive_sha" && sha256sum -c SHA256SUMS)
          jq -e --arg version "$version" --arg commit "$SOURCE_SHA" \
            '.version == $version and .commit == $commit and .platform == "linux-x64-glibc"' \
            "release-assets/$metadata" >/dev/null

      - name: Generate keyless SLSA provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release-assets/swarmforge
            release-assets/SHA256SUMS
            release-assets/metadata-*.json
            release-assets/LICENSE
            release-assets/swarmforge-v*-linux-x64-glibc.tar.gz
            release-assets/swarmforge-v*-linux-x64-glibc.tar.gz.sha256
          create-storage-record: false

      - name: Preserve the versioned Sigstore bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "release-assets/swarmforge-${RELEASE_TAG}-provenance.sigstore.json"

      - name: Upload the versioned Sigstore bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swarmforge-${{ github.ref_name }}-provenance-bundle
          path: release-assets/swarmforge-${{ github.ref_name }}-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft the release for a matching tag
    needs: [build, provenance]
    # Only a pushed v* tag can create a release, and only when the tag names the
    # packaged version. Nothing here publishes a release: the draft is created
    # for a human to review and publish.
    if: github.event_name == 'push' && github.repository == 'GavinGeizer/swarmforge-oss' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The only job that can write release contents, and only to create a draft.
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Require the tag to match the packaged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/package.ts tag "$RELEASE_TAG"

      - name: Download the verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-assets

      - name: Verify the downloaded release assets
        # The archive a release would carry is the archive the build job
        # verified: it is re-checked here rather than rebuilt.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/package.ts release-assets release-assets --tag "$RELEASE_TAG"

      - name: Download the versioned provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: swarmforge-${{ github.ref_name }}-provenance-bundle
          path: release-assets

      - name: Verify keyless provenance for every release asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-provenance.sh release-assets

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "SwarmForge $version" \
            --notes "Linux x64 (glibc) executable for SwarmForge $version, built from $(git rev-parse HEAD) with Bun $(bun --version). Verify with the shipped SHA256SUMS." \
            "release-assets/swarmforge-v${version}-linux-x64-glibc.tar.gz" \
            "release-assets/swarmforge-v${version}-linux-x64-glibc.tar.gz.sha256" \
            "release-assets/SHA256SUMS" \
            "release-assets/metadata-${version}.json" \
            "release-assets/LICENSE" \
            "release-assets/swarmforge-v${version}-provenance.sigstore.json"
